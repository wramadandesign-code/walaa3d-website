name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # autopost.yml starts this via workflow_dispatch after merging an automated post
  # (pushes made with GITHUB_TOKEN do not trigger the push event above).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quality gate for all blog posts
        run: node scripts/validate-post.mjs --all
      - run: npm run build
        env:
          # Public URL of the site (custom domain, DNS on Cloudflare)
          PUBLIC_SITE_URL: https://walaa3d.studio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
